<title>HRHR Camp Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@500;700;800&display=swap">
<style>
/* Layout: sticky scoreboard header with role tabs; one column on phones, a two-column dashboard from 900px. Dark-first "stadium lights" palette. */
:root{
  --bg:#0A1120; --surface:#111A2C; --surface-2:#18233A; --line:#26324D;
  --fg:#EDF1F8; --muted:#97A3BC;
  --red:#E8333D; --on-red:#FFFFFF; --gold:#F3B53A;
  --turf:#1B6E40; --turf-hi:#2DB566; --turf-dim:#14492C;
  --gA:#3CCB7F; --gB:#57AEF2; --gC:#F3B53A; --gD:#F08A3C; --gF:#F05A67;
  --shadow:0 12px 32px rgba(0,0,0,.4);
  --scrim:rgba(4,8,16,.7);
  --f-display:"Saira Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E9EEF5; --line:#D3DAE6;
    --fg:#0D1526; --muted:#55617A;
    --red:#C81E29; --on-red:#FFFFFF; --gold:#9C6700;
    --turf:#25854D; --turf-hi:#39B06A; --turf-dim:#B9DCC6;
    --gA:#16884C; --gB:#1D6FBD; --gC:#946300; --gD:#B8520F; --gF:#C42B3A;
    --shadow:0 10px 26px rgba(20,32,60,.12);
    --scrim:rgba(13,21,38,.45);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E9EEF5; --line:#D3DAE6;
  --fg:#0D1526; --muted:#55617A;
  --red:#C81E29; --on-red:#FFFFFF; --gold:#9C6700;
  --turf:#25854D; --turf-hi:#39B06A; --turf-dim:#B9DCC6;
  --gA:#16884C; --gB:#1D6FBD; --gC:#946300; --gD:#B8520F; --gF:#C42B3A;
  --shadow:0 10px 26px rgba(20,32,60,.12);
  --scrim:rgba(13,21,38,.45);
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.05;letter-spacing:.01em}
h2{font-size:1.45rem;font-weight:700;text-transform:uppercase}
h3{font-size:1.1rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:.04em;line-height:1}
.brand span{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.roles{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.roles a{color:var(--muted);text-decoration:none;font-weight:700;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;border-radius:999px}
.roles a[aria-current="page"]{background:var(--red);color:var(--on-red)}
.demo{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.demo .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:6px}
.tag-demo{font-weight:800;letter-spacing:.12em;color:var(--gold);margin-right:6px}
.linkbtn{background:none;border:0;color:var(--fg);text-decoration:underline;padding:4px 0;font-size:.8rem}

main{padding-block:20px 56px}
.stack{display:grid;gap:16px}
.stack>*{min-width:0}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
.grid2>*{min-width:0}
@media (min-width:900px){.grid2{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);align-items:start}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}

/* Buttons + controls */
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 16px;font-weight:700;letter-spacing:.03em}
.btn:hover{border-color:var(--muted)}
.btn-red{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn-red:hover{filter:brightness(1.08);border-color:var(--red)}
.btn-big{padding:14px 20px;font-size:1.05rem}
.btn[disabled]{opacity:.55;cursor:default;filter:none}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-weight:700;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 0 var(--line)}
select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:600;max-width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;background:var(--surface-2)}
.chip.ok{color:var(--gA);border-color:currentColor}
.chip.warn{color:var(--gC);border-color:currentColor}
.chip.off{color:var(--muted)}
.chip.live{color:var(--red);border-color:currentColor}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* Coach sub-tabs */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--red)}
.subtabs .count{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:99px;background:var(--red);color:var(--on-red);font-size:.75rem;margin-left:6px;padding:0 6px;font-family:var(--f-body)}

/* Grade colors */
.gA{color:var(--gA)} .gB{color:var(--gB)} .gC{color:var(--gC)} .gD{color:var(--gD)} .gF{color:var(--gF)}
.bgA{background:var(--gA)} .bgB{background:var(--gB)} .bgC{background:var(--gC)} .bgD{background:var(--gD)} .bgF{background:var(--gF)}

/* Coach */
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.ctl-l{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:1.2rem;font-weight:700}
.sess-title{font-family:var(--f-display);font-weight:800;font-size:2rem;text-transform:uppercase;line-height:1}
.sess-sub{color:var(--muted);font-weight:600}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--turf-hi)}
.roster{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.ath{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.ath:hover{border-color:var(--muted)}
.jersey{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-display);font-weight:800;font-size:1.35rem;flex:none}
.ath b{display:block;font-weight:700}
.ath small{color:var(--muted);font-size:.78rem}
.ath .sc{font-family:var(--f-display);font-weight:800;font-size:1.4rem;text-align:right;line-height:1}
.ath .sc small{display:block;font-family:var(--f-body);font-weight:600;font-size:.7rem;margin-top:3px}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:8px}
.list li:last-child{border-bottom:0;padding-bottom:0}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-weight:600}
.steps li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-display);font-weight:800}

/* Quick rate by skill */
.qr{display:grid;gap:8px}
.qrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.qrow .who{display:flex;gap:10px;align-items:center;min-width:0}
.qrow .who b{display:block;line-height:1.2}
.qrow .who small{color:var(--muted);font-size:.75rem}
.qrow .scale{grid-column:1 / -1}
@media (min-width:640px){.qrow{grid-template-columns:minmax(0,220px) minmax(0,1fr) auto}.qrow .scale{grid-column:auto}}
.qrow.away{opacity:.55}
.mini{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 10px;font-size:.78rem;font-weight:700}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;justify-content:center;align-items:flex-end}
@media (min-width:760px){.sheet{align-items:center}}
.sheet-p{background:var(--bg);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;border:1px solid var(--line);box-shadow:var(--shadow);padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.sheet-p{border-radius:18px;max-height:88%}}
.sheet-h{position:sticky;top:0;background:var(--bg);display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:14px;border-bottom:1px solid var(--line);z-index:1}
.sheet-f{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.sheet-sec{padding-top:18px;display:grid;gap:12px}
.rate{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.rate-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.rate-h b{font-weight:700}
.rate-h span{color:var(--muted);font-size:.82rem}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.scale button.on{background:var(--red);border-color:var(--red);color:var(--on-red)}
.scale button.carry{border:2px dashed var(--muted);color:var(--fg)}
.rub{font-size:.85rem;color:var(--muted);min-height:1.3em}
.rub b{color:var(--fg)}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
details.more summary{cursor:pointer;font-weight:700}
details.more[open] summary{margin-bottom:12px}
details.more .rate{background:var(--surface-2)}
.tests{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.field{display:grid;gap:4px;min-width:0}
.field label{font-weight:700;font-size:.85rem}
.field input,.field textarea,.field select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.field small{color:var(--muted);font-size:.75rem}
.tagbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.85rem}
.tagbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tagbtn.sug{border-color:var(--gold)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700}
.sw{width:52px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw[aria-checked="true"]{background:var(--turf-hi);border-color:var(--turf-hi)}
.sw[aria-checked="true"]::after{left:25px;background:#fff}

/* Send + roster */
.fam{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fam summary{cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.fam summary b{display:block}
.fam summary small{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.msg{white-space:pre-wrap;font-family:var(--f-body);font-size:.92rem;background:var(--surface-2);border-radius:10px;padding:12px 14px;margin:12px 0 10px;overflow-wrap:anywhere}
.formgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:440px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
td .num{font-size:1.1rem;font-weight:700}
td small{display:block;color:var(--muted);font-size:.75rem}
code{font-size:.82rem;background:var(--surface-2);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}

/* Parent hero */
.hero{display:grid;gap:18px;grid-template-columns:1fr;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;border:26px solid var(--red);opacity:.08;pointer-events:none}
@media (min-width:640px){.hero{grid-template-columns:1fr auto}}
.hero h1{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:800;text-transform:uppercase}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-weight:600;margin-top:6px}
.ringbox{display:grid;justify-items:center;gap:8px}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val b{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:.9}
.ring .val small{display:block;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ring-track{stroke:var(--surface-2)}
.ring-bar{stroke:currentColor;transition:stroke-dashoffset .6s ease}

.update{border-left:4px solid var(--red)}
.quote{font-size:1.08rem;font-weight:500;border-radius:12px;background:var(--surface-2);padding:14px 16px;margin-top:6px}
.quote cite{display:block;font-style:normal;font-size:.8rem;color:var(--muted);margin-top:6px;font-weight:700}
.kv{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));margin-top:14px}
.kv div{min-width:0}
.kv p{font-weight:600}
.mission{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border:1px dashed var(--gold);border-radius:12px;padding:12px 14px;margin-top:14px}
.mission svg{flex:none;color:var(--gold)}

/* Growth plan */
.plan{display:grid;gap:12px}
.goal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--surface-2);border-radius:12px;padding:14px}
.goal .rank{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem;background:var(--surface);border:1px solid var(--line)}
.goal.first .rank{background:var(--red);color:var(--on-red);border-color:var(--red)}
.goal h4{margin:0;font-family:var(--f-display);font-size:1.25rem;text-transform:uppercase;letter-spacing:.03em}
.goal p{margin-top:4px}
.drill{margin-top:8px;border-left:3px solid var(--gold);padding-left:10px;font-weight:600}
.keep{display:flex;gap:10px;align-items:center;font-weight:700;margin-top:4px}

/* Drive chart: the camp as a football field */
.field-wrap{overflow-x:auto}
.drive{display:grid;grid-template-columns:.7fr repeat(8,1fr) .7fr;min-width:520px;height:96px;border-radius:10px;overflow:hidden;background:var(--turf);position:relative}
.ez{display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;letter-spacing:.12em;font-size:.72rem;writing-mode:vertical-rl;transform:rotate(180deg);background:var(--red)}
.ez.home{background:#0F2A1B;color:rgba(255,255,255,.75)}
.yd{position:relative;border-left:2px solid rgba(255,255,255,.55);display:grid;align-content:space-between;justify-items:center;padding:6px 2px;color:#fff;background:var(--turf)}
.yd.done{background:var(--turf-hi)}
.yd.miss{background:repeating-linear-gradient(135deg,var(--turf) 0 6px,#16593A 6px 12px)}
.yd.future{background:var(--turf);opacity:.55}
.yd span{font-family:var(--f-display);font-weight:800;font-size:.95rem;line-height:1}
.yd small{font-size:.62rem;font-weight:700;letter-spacing:.08em;opacity:.9}
.yd .ball{width:30px;height:18px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}

/* Pillars */
.pillars{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.pillar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:4px}
.pillar .g{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1}
.pillar .w{font-weight:700}
.delta{font-size:.8rem;font-weight:700}
.up{color:var(--gA)} .down{color:var(--gF)} .flat{color:var(--muted)}

.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 3.2em;gap:10px;align-items:center}
.bar b{font-weight:600;font-size:.9rem}
.bar .t{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:99px}
.bar .v{font-family:var(--f-display);font-weight:800;text-align:right;font-size:1.05rem}

.chart text{fill:var(--muted);font-family:var(--f-body);font-size:17px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{stroke:var(--red);stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--red);opacity:.12}
.chart .dot{fill:var(--surface);stroke:var(--red);stroke-width:2.5}
.chart .dot.end{fill:var(--red)}
.chart .endlbl{fill:var(--fg);font-family:var(--f-display);font-weight:800;font-size:22px}

.hist{display:grid;gap:10px}
.hist details{background:var(--surface-2);border-radius:10px;padding:10px 14px}
.hist summary{cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hist p{margin-top:8px}

/* Athlete portal */
.pcard{position:relative;overflow:hidden;border-radius:18px;padding:22px;background:linear-gradient(160deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--line)}
.pcard .bignum{position:absolute;right:-6px;bottom:-34px;font-family:var(--f-display);font-weight:800;font-size:11rem;line-height:1;color:var(--red);opacity:.16;pointer-events:none}
.pcard h1{font-size:clamp(2.2rem,8vw,3.6rem);font-weight:800;text-transform:uppercase}
.lvl{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:var(--on-red);font-family:var(--f-display);font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:6px;font-size:1rem}
.xp{margin-top:16px;display:grid;gap:6px;max-width:520px;position:relative}
.xp .progress{height:14px}
.xp .progress i{background:linear-gradient(90deg,var(--gold),var(--red))}
.xp-row{display:flex;justify-content:space-between;font-weight:700;font-size:.85rem;gap:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;position:relative}
.dots span{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.85rem;border:1px solid var(--line);background:var(--surface)}
.dots span.on{background:var(--turf-hi);border-color:var(--turf-hi);color:#062314}
.dots span.miss{color:var(--muted);text-decoration:line-through}
.pbs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.pb{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:2px}
.pb .q{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.pb .v{font-family:var(--f-display);font-weight:800;font-size:2.2rem;line-height:1}
.pb .v small{font-size:1rem;color:var(--muted);margin-left:2px}
.badges{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.badge{display:grid;justify-items:center;text-align:center;gap:6px}
.badge svg{width:64px;height:72px}
.badge b{font-size:.82rem;line-height:1.2}
.badge small{font-size:.7rem;color:var(--muted);line-height:1.25}
.badge.locked svg{opacity:.35}
.badge .hex{fill:var(--surface-2);stroke:var(--line);stroke-width:2}
.badge.got .hex{fill:var(--red);stroke:var(--gold);stroke-width:3}
.badge .code{font-family:var(--f-display);font-weight:800;font-size:22px;fill:var(--muted)}
.badge.got .code{fill:var(--on-red)}
.power{display:grid;gap:8px}
.power div{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-weight:700}
.power div i{font-style:normal;font-family:var(--f-display);font-weight:800;color:var(--gold);font-size:1.2rem;width:1.4em}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);font-weight:700;padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<script>
(function(){
'use strict';
var $ = function(s){return document.querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function avg(a){return a.length? a.reduce(function(x,y){return x+y;},0)/a.length : null;}
function first(name){return String(name).split(' ')[0];}

/* ---------- Camp program ---------- */
var SITES={prosper:{name:'Prosper Rec Center',short:'Prosper'},plano:{name:'Plano Oak Point Rec Center',short:'Plano Oak Point'}};
var GROUPS={'8-9':'Rookies 8–9','10-11':'Juniors 10–11'};
var COACHES=['Coach Niko','Coach Ray','Coach Dee'];
// foc = the 3 traits coaches must rate that day (tied to the session theme). Everything else carries over.
var SESS=[
 {n:1,date:'Tue Jun 8',wk:1,theme:'Baseline Day',focus:'Testing, athletic stance and starts',test:true,foc:['compete','coach','feet'],mission:'Wall drill: 3 sets of 20 seconds. Fast knees, tall posture, drive the arms.'},
 {n:2,date:'Thu Jun 10',wk:1,theme:'Speed Mechanics',focus:'Arm drive, first three steps, acceleration posture',foc:['feet','coach','compete'],mission:'A-skips down the driveway and back, 3 rounds. Then 4 fast 10-yard starts.'},
 {n:3,date:'Tue Jun 15',wk:2,theme:'Change of Direction',focus:'Plant foot, sink the hips, explode out of the cut',foc:['feet','tough','coach'],mission:'Set two shoes 5 yards apart. 5 figure-8s each direction, low hips the whole way.'},
 {n:4,date:'Thu Jun 17',wk:2,theme:'Midpoint Testing + Ball Skills',focus:'Re-test, then hands: eyes to the tuck',test:true,foc:['hands','iq','love'],mission:'50 catches with a parent or against a wall. Watch the ball all the way into your hands.'},
 {n:5,date:'Tue Jun 22',wk:3,theme:'Position Day',focus:'QB, WR, RB, DB and LB stations',foc:['tech','iq','love'],mission:'Teach someone at home one thing you learned at your position today.'},
 {n:6,date:'Thu Jun 24',wk:3,theme:'Defense & Pursuit',focus:'Backpedal, breaking on the ball, pursuit angles, safe flag pulls',foc:['tech','tough','team'],mission:'Backpedal 10 yards, turn and sprint 10 yards. 6 reps with full rest.'},
 {n:7,date:'Tue Jun 29',wk:4,theme:'Team & Leadership',focus:'Captains, huddles, calling plays, picking up teammates',foc:['lead','team','compete'],mission:'Do one helpful thing at home without being asked. Tell your coach about it.'},
 {n:8,date:'Thu Jul 1',wk:4,theme:'Final Testing + Camp Bowl',focus:'Final testing, the Camp Bowl and awards',test:true,foc:['compete','lead','team'],mission:'Keep the HRHR habit: 3 sprint days a week for the rest of the summer.'}
];
// r = rubric for 1..5. home = 10-minute at-home drill parents can run. kid = how the athlete hears it.
var TRAITS=[
 {id:'compete',p:'char',name:'Compete',d:'Effort and will to win',r:['Goes through the motions','Competes when it is fun or easy','Solid effort on most reps','Competes hard on nearly every rep','Max effort every rep; wins and loses with class'],home:'Race a sibling or parent: 5 races of 10 yards. Keep score out loud. The winner picks the next drill.',kid:'Win every rep. Race someone at home 5 times and keep score.'},
 {id:'coach',p:'char',name:'Coachability',d:'Listens and applies feedback',r:['Repeats the same mistakes','Listens but rarely adjusts','Adjusts after a few reminders','Fixes it on the very next rep','Asks questions and seeks out coaching'],home:'Ask: "What was one coaching point today?" Have them show you the fix 5 times in a row.',kid:'Tell your family one coaching point from today and show them the fix 5 times.'},
 {id:'team',p:'char',name:'Teamwork',d:'Plays for the group',r:['Plays for self','Gets along, stays in own lane','Good teammate when things go well','Encourages others and shares the ball','Lifts the whole group; celebrates others first'],home:'Ask them to name a teammate who did something great. Next session, they tell that teammate.',kid:'Find a teammate doing something great next session and tell them.'},
 {id:'lead',p:'char',name:'Leadership',d:'Sets the standard',r:['Follows only when told','Leads by example sometimes','Leads by example consistently','Speaks up and organizes others','Others follow them; sets the standard'],home:'Let them lead the family warm-up: they pick 3 exercises, call them out and count every rep.',kid:'Lead a warm-up at home: pick 3 exercises and count the reps out loud.'},
 {id:'tough',p:'char',name:'Toughness',d:'Pushes through hard moments',r:['Shuts down when tired or after mistakes','Needs encouragement to push through','Pushes through most hard moments','Bounces back fast from mistakes','Gets better when it gets hard'],home:'Wall sits: 3 rounds of 30 seconds. Talk about what to say to yourself when it burns.',kid:'3 wall sits of 30 seconds. When it burns, say "next rep".'},
 {id:'love',p:'char',name:'Love of the Game',d:'Interest and energy',r:['Seems checked out','Interested in parts of practice','Engaged and having fun','Excited and eager for the next drill','Lives for it; asks for extra work'],home:'Watch 10 minutes of football together. Ask which position looks the most fun and why.',kid:'Watch some football and pick the player you want to play like.'},
 {id:'feet',p:'skill',name:'Footwork',d:'Stance, starts, balance, cuts',r:['Off balance, heavy feet','Gets there, but slow or upright','Balanced; decent stance and starts','Quick, low and controlled in cuts','Elite balance; sharp and explosive'],home:'Chalk 4 squares on the driveway. Quick feet in and out, 4 rounds of 15 seconds.',kid:'Quick feet: 4 rounds of 15 seconds in and out of chalk squares.'},
 {id:'hands',p:'skill',name:'Ball Skills',d:'Catch, carry, throw',r:['Struggles to catch or carry','Catches easy balls, often with the body','Reliable hands on routine balls','Catches away from the body and secures it','Makes the tough catch look easy'],home:'50 catches a day with a parent or a wall. Hands make a diamond, eyes watch the ball into the tuck.',kid:'50 catches a day. Make a diamond with your hands and watch it all the way in.'},
 {id:'iq',p:'skill',name:'Football IQ',d:'Assignments and awareness',r:['Unsure where to line up','Knows the drill once shown','Understands assignments','Anticipates plays and adjusts','Sees the field; helps teammates line up'],home:'Draw 3 plays on paper together. Ask: where does each player go, and why?',kid:'Draw 3 plays and explain where everyone goes.'},
 {id:'tech',p:'skill',name:'Position Technique',d:'Fundamentals at speed',r:['Basic technique not there yet','Learning the fundamentals','Fundamentals show up in drills','Technique holds up at full speed','Holds up in live play; can demo it'],home:'10 perfect stances and starts. Check feet, hands and eyes every time before going.',kid:'10 perfect stances and starts. Check feet, hands, eyes.'}
];
var TESTS=[
 {id:'dash',name:'20-Yard Dash',q:'Speed',unit:'s',lower:true,b:{'8-9':[4.8,3.6],'10-11':[4.5,3.4]},home:'4 starts of 10 yards from a two-point stance. Full rest between each. Arms drive cheek to cheek.'},
 {id:'shuttle',name:'5-10-5 Shuttle',q:'Agility',unit:'s',lower:true,b:{'8-9':[7.2,5.4],'10-11':[6.8,5.1]},home:'Two shoes 5 yards apart. Touch and go, 5 reps each direction, staying low at every turn.'},
 {id:'broad',name:'Broad Jump',q:'Power',unit:'in',lower:false,b:{'8-9':[36,72],'10-11':[44,84]},home:'Squat jumps: 3 sets of 5. Swing the arms, jump far, land soft and stick it for 2 seconds.'},
 {id:'push',name:'Push-ups (30 s)',q:'Strength',unit:'reps',lower:false,b:{'8-9':[3,25],'10-11':[5,30]},home:'Push-ups: 3 sets of as many good ones as possible. Knees down is fine. Chest to the floor every rep.'}
];
var TAGS=['Hustle','Great teammate','Listened first time','Encouraged others','Fought through fatigue','Big play','Led a drill','Needs more focus'];
var PHRASES=[['Hustle','{n} gave max effort on every single rep today.'],['Toughness','{n} kept pushing when the whole group was tired.'],['Teammate','{n} picked up a teammate without being asked.'],['Coachable','{n} heard the coaching point once and fixed it on the next rep.'],['Big play','{n} made one of the plays of the day.'],['Leader','{n} led the group in warm-ups and set the tone.']];
var LEVELS=[[0,'Rookie'],[700,'Starter'],[1500,'Playmaker'],[2500,'Captain'],[3600,'HRHR Elite']];
function T_(id){return TRAITS.filter(function(t){return t.id===id;})[0];}
function TS_(id){return TESTS.filter(function(t){return t.id===id;})[0];}

/* ---------- Demo data (fictional people; 555-01xx numbers and example.com are reserved for fiction) ---------- */
var DEFS=[
 ['Mason T.','prosper','10-11',7,'Dana T.','text','(469) 555-0101'],['Ava R.','prosper','8-9',12,'Marcus R.','email','marcus.r@example.com'],
 ['Jayden W.','prosper','10-11',22,'Keisha W.','text','(469) 555-0103'],['Liam K.','prosper','8-9',3,'Sarah K.','email','sarah.k@example.com'],
 ['Zoe M.','prosper','10-11',11,'Andre M.','text','(469) 555-0105'],['Carter B.','prosper','8-9',5,'Jen B.','email','jen.b@example.com'],
 ['Elijah P.','prosper','10-11',24,'Tasha P.','text','(469) 555-0107'],['Harper S.','prosper','8-9',9,'Chris S.','email','chris.s@example.com'],
 ['Noah D.','plano','10-11',1,'Monique D.','text','(972) 555-0109'],['Mia L.','plano','8-9',14,'David L.','email','david.l@example.com'],
 ['Josiah F.','plano','10-11',33,'Erica F.','text','(972) 555-0111'],['Kai N.','plano','8-9',8,'Brian N.','email','brian.n@example.com'],
 ['Isaiah G.','plano','10-11',2,'Latoya G.','text','(972) 555-0113'],['Ella J.','plano','8-9',18,'Mike J.','email','mike.j@example.com']
];
var SHOUTS=[
 '{n} won the get-off race three times in a row. Explosive first step today.',
 '{n} picked up a teammate after a dropped ball without being asked. That is leadership.',
 '{n} heard the coaching point once and nailed the cut on the very next rep.',
 '{n} kept sprinting through the final rep when the whole group was tired. Real toughness.',
 '{n} called out the coverage before the snap. The football IQ is showing up.',
 '{n} brought the loudest voice in the huddle and the best energy on the field.',
 '{n} made the catch of the day on a contested ball. Strong, soft hands.'
];

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeDemo(){
  var R=rng(2027), athletes=[], records={};
  DEFS.forEach(function(d,i){
    var a={id:'a'+(i+1),name:d[0],site:d[1],band:d[2],num:d[3],guardian:d[4],method:d[5],contact:d[6]};
    athletes.push(a); records[a.id]={};
    var base={}; TRAITS.forEach(function(t){base[t.id]=1.7+R()*2.1;});
    var growth=0.1+R()*0.24, tn={}; TESTS.forEach(function(t){tn[t.id]=0.12+R()*0.5;});
    var last=a.site==='prosper'?6:5;
    for(var n=1;n<=last;n++){
      if(n===6 && i%2===1) continue;
      var present=!(n!==1 && R()<0.07);
      var rec={present:present,r:{},c:{},t:{},tags:[],shout:'',focus:'',work:'',coach:COACHES[Math.floor(R()*3)]};
      if(present){
        TRAITS.forEach(function(t){rec.r[t.id]=clamp(Math.round(base[t.id]+growth*(n-1)+(R()-.5)*0.9),1,5);});
        if(SESS[n-1].test){
          TESTS.forEach(function(t){
            var fc=t.b[a.band], gain=n===1?0:(n===4?0.06+R()*0.1:0.14+R()*0.14);
            var v=fc[0]+(fc[1]-fc[0])*Math.min(.97,tn[t.id]+gain);
            rec.t[t.id]=t.unit==='s'?Math.round(v*100)/100:Math.round(v);
          });
        }
        if(R()<0.75) rec.shout=SHOUTS[Math.floor(R()*SHOUTS.length)].replace('{n}',first(a.name));
        rec.work=suggestWork(rec.r,SESS[n-1].foc);
        rec.tags=[TAGS[Math.floor(R()*7)]];
      }
      records[a.id][n]=rec;
    }
  });
  return {v:2,athletes:athletes,records:records,published:{prosper:[1,2,3,4,5],plano:[1,2,3,4,5]},current:{prosper:6,plano:6},
    gradeFormat:'letter',site:'prosper',group:'all',parentChild:'a1',athleteChild:'a1',coach:'Coach Niko',tab:'rate',mode:'athlete',skill:''};
}
var KEY='hrhr-camp-demo-v2', state=null;
try{state=JSON.parse(localStorage.getItem(KEY));}catch(e){state=null;}
if(!state||state.v!==2||!state.athletes) state=makeDemo();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function byId(id){return state.athletes.filter(function(a){return a.id===id;})[0]||state.athletes[0];}
function rec(a,n){var r=state.records[a.id]; return r?r[n]:null;}
function lastPresent(a,n){for(var k=n-1;k>=1;k--){var r=rec(a,k);if(r&&r.present)return {n:k,r:r};}return null;}
// New record for today, with ratings carried over from the last session they attended (flagged in c{} until a coach taps them).
function freshRec(a,n){
  var lp=lastPresent(a,n), r={present:true,r:{},c:{},t:{},tags:[],shout:'',focus:'',work:'',coach:state.coach};
  if(lp){TRAITS.forEach(function(t){if(lp.r.r[t.id]!=null){r.r[t.id]=lp.r.r[t.id];r.c[t.id]=true;}});}
  return r;
}
// The growth area for parents: lowest rating, today's focus traits break ties.
function suggestWork(ratings,foc){
  var best=null;
  TRAITS.forEach(function(t){var v=ratings[t.id];if(v==null)return;var key=v-(foc&&foc.indexOf(t.id)>=0?0.1:0);if(!best||key<best.k)best={k:key,id:t.id};});
  return best?best.id:'';
}

/* ---------- Scoring ---------- */
// Ratings 1–5 map onto the 100-point scale: 1≈55 (F), 2≈66 (D), 3≈76 (C), 4≈87 (B+), 5=98 (A+).
function rScore(r){return 44+10.8*r;}
// Tests: the age-band "developing" floor scores 55, the "elite" ceiling scores 98.
function tScore(t,v,band){if(v==null||v==='')return null;var fc=t.b[band];return 55+43*clamp((v-fc[0])/(fc[1]-fc[0]),0,1);}
function pres(a,ss){return ss.map(function(n){return [n,rec(a,n)];}).filter(function(x){return x[1]&&x[1].present;});}
function traitNow(a,tid,ss){var v=pres(a,ss).map(function(x){return x[1].r[tid];}).filter(function(x){return x!=null;});return v.length?avg(v.slice(-2)):null;}
function pillar(a,p,ss){var v=TRAITS.filter(function(t){return t.p===p;}).map(function(t){return traitNow(a,t.id,ss);}).filter(function(x){return x!=null;});return v.length?rScore(avg(v)):null;}
function tests(a,ss){
  var out={};
  TESTS.forEach(function(t){
    var vals=pres(a,ss).filter(function(x){return x[1].t&&x[1].t[t.id]!=null&&x[1].t[t.id]!=='';}).map(function(x){return {n:x[0],v:+x[1].t[t.id]};});
    var best=null; vals.forEach(function(x){if(!best||(t.lower?x.v<best.v:x.v>best.v))best=x;});
    out[t.id]={vals:vals,base:vals[0]||null,latest:vals[vals.length-1]||null,best:best};
  });
  return out;
}
function athletic(a,ss){var T=tests(a,ss);var v=TESTS.map(function(t){return T[t.id].latest?tScore(t,T[t.id].latest.v,a.band):null;}).filter(function(x){return x!=null;});return v.length?avg(v):null;}
function overall(a,ss){
  var parts=[[athletic(a,ss),.35],[pillar(a,'skill',ss),.30],[pillar(a,'char',ss),.35]].filter(function(p){return p[0]!=null;});
  if(!parts.length)return null;
  var w=parts.reduce(function(s,p){return s+p[1];},0);
  return parts.reduce(function(s,p){return s+p[0]*p[1];},0)/w;
}
function series(a,ss){return pres(a,ss).map(function(x){var n=x[0];return {n:n,v:overall(a,ss.filter(function(s){return s<=n;}))};});}
function improvement(tt,lower){if(!tt.base||!tt.latest||tt.base.n===tt.latest.n)return 0;return lower?tt.base.v-tt.latest.v:tt.latest.v-tt.base.v;}
var LET=[[97,'A+'],[93,'A'],[90,'A-'],[87,'B+'],[83,'B'],[80,'B-'],[77,'C+'],[73,'C'],[70,'C-'],[67,'D+'],[63,'D'],[60,'D-'],[0,'F']];
function letter(s){for(var i=0;i<LET.length;i++){if(s>=LET[i][0])return LET[i][1];}return 'F';}
function gc(s){return s==null?'':s>=90?'gA':s>=80?'gB':s>=70?'gC':s>=60?'gD':'gF';}
function word(s){return s==null?'No data yet':s>=90?'Elite':s>=80?'Strong':s>=70?'Solid':s>=60?'Developing':'Building';}
function fmt(s,f){f=f||state.gradeFormat;if(s==null)return '—';return f==='letter'?letter(s):f==='100'?String(Math.round(s)):(s/10).toFixed(1);}
function unitLabel(){return state.gradeFormat==='100'?'out of 100':state.gradeFormat==='10'?'out of 10':'grade';}
function pubOf(a){return (state.published[a.site]||[]).slice().sort(function(x,y){return x-y;});}
function coachSS(a){var c=state.current[a.site];return [1,2,3,4,5,6,7,8].filter(function(n){return n<=c;});}
function delta(now,then){
  if(now==null||then==null)return '';
  var d=now-then, f=state.gradeFormat==='10'?(d/10).toFixed(1):Math.round(d);
  if(Math.abs(d)<0.5)return '<span class="delta flat">Steady since Day 1</span>';
  return d>0?'<span class="delta up">▲ +'+f+' pts since Day 1</span>':'<span class="delta down">▼ '+f+' pts since Day 1</span>';
}

/* Growth plan: #1 = the coach's "work on" pick from the latest update, #2 = weakest test vs. age benchmark, #3 = next-lowest trait. */
function growthPlan(a,ss){
  var latest=null; pres(a,ss).forEach(function(p){latest=p;});
  var plan=[], used={};
  var workId=latest?(latest[1].work||suggestWork(latest[1].r,SESS[latest[0]-1].foc)):'';
  if(workId){var t=T_(workId);plan.push({kind:'trait',t:t,name:t.name,why:'Coach\'s pick from Session '+latest[0]+'.',good:t.r[4],home:t.home,kid:t.kid});used[workId]=1;}
  var T=tests(a,ss), weakest=null;
  TESTS.forEach(function(t){var x=T[t.id].latest;if(!x)return;var s=tScore(t,x.v,a.band);if(!weakest||s<weakest.s)weakest={t:t,s:s,v:x.v};});

  var rest=TRAITS.map(function(t){return {t:t,v:traitNow(a,t.id,ss)};}).filter(function(z){return z.v!=null&&!used[z.t.id];}).sort(function(p,q){return p.v-q.v;});

}
function strength(a,ss){var top=TRAITS.map(function(t){return {t:t,v:traitNow(a,t.id,ss)};}).filter(function(z){return z.v!=null;}).sort(function(p,q){return q.v-p.v;});return top;}

function xpOf(a,ss){

function positionRead(a,ss){

/* ---------- Family message (what each parent receives) ---------- */
function familyMessage(a,n){
  var r=rec(a,n), S=SESS[n-1], kid=first(a.name), g=first(a.guardian||'there');
  var ss=pubOf(a).filter(function(x){return x<n;}).concat([n]);
  var lines=['Hi '+g+'! Here is '+kid+'\'s HRHR Camp update for Session '+n+': '+S.theme+' ('+S.date+').',''];
  if(!r||!r.present){
    lines.push('We missed '+kid+' today. We worked on: '+S.focus+'.','','At-home mission: '+S.mission);
  }else{
    if(r.shout)lines.push('Shout-out: '+r.shout,'');
    var top=strength(a,ss)[0];
    if(top)lines.push('Strength: '+top.t.name+'. Keep it up.');
    var w=r.work?T_(r.work):null;
    if(w){lines.push('Work on: '+w.name+'. A 5 looks like: '+w.r[4].charAt(0).toLowerCase()+w.r[4].slice(1)+'.','At home (10 min): '+w.home);}
    if(r.focus)lines.push('Next session focus: '+r.focus);
    var tested=S.test&&r.t&&Object.keys(r.t).length;
    if(tested){var T=tests(a,ss);var parts=TESTS.filter(function(t){return T[t.id].latest&&T[t.id].latest.n===n;}).map(function(t){var d=improvement(T[t.id],t.lower);return t.name+' '+T[t.id].latest.v+' '+t.unit+(d>0?' (improved '+(t.unit==='s'?d.toFixed(2):Math.round(d))+')':'');});if(parts.length)lines.push('','Testing: '+parts.join(', ')+'.');}
    lines.push('','At-home mission: '+S.mission);

  }
  lines.push('','The full report is in the HRHR parent portal.','- '+((r&&r.coach)||state.coach)+', High Risk High Reward');
  return lines.join('\n');
}

function trendChart(pts){
  var W=600,H=250,pl=44,pr=34,pt=30,pb=34;
  function x(n){return pl+(n-1)*(W-pl-pr)/7;}
  function y(v){return pt+(100-clamp(v,50,100))*(H-pt-pb)/50;}
  var g='';
  [[60,'D'],[70,'C'],[80,'B'],[90,'A'],[100,'']].forEach(function(l){g+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(l[0])+'" y2="'+y(l[0])+'"/><text x="'+(pl-6)+'" y="'+(y(l[0])+5)+'" text-anchor="end">'+l[0]+'</text>'+(l[1]?'<text x="'+(W-pr+8)+'" y="'+(y(l[0]-5)+5)+'">'+l[1]+'</text>':'');});
  for(var n=1;n<=8;n++)g+='<text x="'+x(n)+'" y="'+(H-8)+'" text-anchor="middle">S'+n+'</text>';
  pts=pts.filter(function(p){return p.v!=null;});
  if(!pts.length)return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="No scores yet">'+g+'</svg>';
  var line=pts.map(function(p,i){return (i?'L':'M')+x(p.n).toFixed(1)+' '+y(p.v).toFixed(1);}).join(' ');
  var area=line+' L'+x(pts[pts.length-1].n).toFixed(1)+' '+y(50)+' L'+x(pts[0].n).toFixed(1)+' '+y(50)+' Z';
  var dots=pts.map(function(p,i){return '<circle class="dot'+(i===pts.length-1?' end':'')+'" cx="'+x(p.n)+'" cy="'+y(p.v)+'" r="'+(i===pts.length-1?6:4)+'"/>';}).join('');

  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Overall score by session, latest '+fmt(e.v)+'">'+g+'<path class="area" d="'+area+'"/><path class="line" d="'+line+'"/>'+dots+lbl+'</svg>';

function testCell(t,x){return x?'<span class="num">'+x.v+'</span> <span class="muted">'+t.unit+'</span>':'<span class="muted">—</span>';}
function changeText(t,tt){
  var d=improvement(tt,t.lower);

function status(a,n){var r=rec(a,n);if(!r)return 'todo';if(!r.present)return 'absent';var c=r.c||{};return SESS[n-1].foc.every(function(t){return r.r[t]!=null&&!c[t];})?'done':'todo';}

   '<div style="display:grid;gap:8px;margin-top:14px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700"><span>'+done+' rated · '+abs+' absent · '+left+' to go</span><span>'+(isPub?'<span class="chip ok">Sent to families</span>':'<span class="chip warn">Not sent yet</span>')+'</span></div><div class="progress"><i style="width:'+(all.length?Math.round((done+abs)/all.length*100):0)+'%"></i></div></div></div>';

     planHtml(a,ss,true)+
     '<div class="card"><div class="card-h"><h3>Personal bests</h3><span class="muted">Beat your own number</span></div><div class="pbs">'+TESTS.map(function(t){var tt=T[t.id],b=tt.best,d=improvement(tt,t.lower);return '<div class="pb"><span class="q">'+t.q+' · '+t.name+'</span><span class="v">'+(b?b.v+'<small>'+t.unit+'</small>':'—')+'</span>'+(d>0?'<span class="delta up">▲ '+(t.unit==='s'?d.toFixed(2):Math.round(d))+' '+t.unit+' better</span>':'<span class="delta flat">'+(tt.vals.length>1?'Next test: go get it':'Baseline set')+'</span>')+'</div>';}).join('')+'</div></div>'+
     '<div class="card"><div class="card-h"><h3>Badges</h3><span class="muted">'+earned+' of '+BADGES.length+' earned</span></div><div class="badges">'+BADGES.map(function(b){var ok=b.ok(a,ss,T);return '<div class="badge '+(ok?'got':'locked')+'">'+badgeSvg(b.code)+'<b>'+b.name+'</b><small>'+(ok?'Earned':esc(b.how))+'</small></div>';}).join('')+'</div></div>'+
   '</div><div class="stack">'+
     (lastShout?'<div class="card update"><div class="eyebrow">'+esc(lastShout.c||'Coach')+' says · Session '+lastShout.n+'</div><div class="quote">“'+esc(lastShout.s)+'”</div></div>':'')+
     '<div class="card"><h3>Your superpowers</h3><div class="power" style="margin-top:12px">'+(top.map(function(z,i){return '<div><i>'+(i+1)+'</i>'+z.t.name+'</div>';}).join('')||'<p class="muted">Coming after your first session.</p>')+'</div></div>'+
     '<div class="card"><h3>How to earn XP</h3><ul class="list" style="margin-top:10px"><li><span>Show up to a session</span><b class="num">+100</b></li><li><span>Every rating point from your coach</span><b class="num">+8</b></li><li><span>Coach shout-out</span><b class="num">+50</b></li><li><span>New personal best on a test</span><b class="num">+75</b></li></ul></div>'+
   '</div></div></div>';
}

/* ---------- Router + events ---------- */
var ROLES=['coach','parent','athlete'];
function role(){var h=location.hash.replace('#','');return ROLES.indexOf(h)>=0?h:'coach';}
function render(){
  var r=role();
  document.querySelectorAll('.roles a').forEach(function(el){if(el.getAttribute('data-role')===r)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});
  $('#app').innerHTML=r==='coach'?renderCoach():r==='athlete'?renderAthlete():renderParent();
}
var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2600);}
function addAthlete(o){
  var id='a'+Date.now().toString(36)+Math.floor(Math.random()*1e4);
  var contact=o.contact.trim();
  state.athletes.push({id:id,name:o.first.trim().charAt(0).toUpperCase()+o.first.trim().slice(1)+' '+o.last.trim().charAt(0).toUpperCase()+'.',site:o.site,band:o.band,num:+o.num||0,guardian:o.guardian.trim(),contact:contact,method:contact.indexOf('@')>=0?'email':'text'});
  state.records[id]={};
}
var resetArmed=false;
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='fmt'){state.gradeFormat=el.getAttribute('data-f');save();render();}
  else if(act==='site'){state.site=el.getAttribute('data-site');save();render();}
  else if(act==='group'){state.group=el.getAttribute('data-g');save();render();}
  else if(act==='mode'){state.mode=el.getAttribute('data-m');save();render();}
  else if(act==='skill'){state.skill=el.getAttribute('data-tid');save();render();}
  else if(act==='tab'){state.tab=el.getAttribute('data-tab');save();render();window.scrollTo(0,0);}
  else if(act==='sess'){var s=state.site;state.current[s]=clamp(state.current[s]+(+el.getAttribute('data-d')),1,8);save();render();}
  else if(act==='publish'){var site=state.site,n=state.current[site];if(state.published[site].indexOf(n)<0)state.published[site].push(n);save();render();toast('Session '+n+' updates sent to '+siteRoster().length+' '+SITES[site].short+' families');}
  else if(act==='copy'){
    var pre=$('#msg_'+el.getAttribute('data-id')), txt=pre?pre.textContent:'';
    var done=function(){el.textContent='Copied';setTimeout(function(){el.textContent='Copy message';},1500);};
    var fallback=function(){var rg=document.createRange();rg.selectNodeContents(pre);var sel=window.getSelection();sel.removeAllRanges();sel.addRange(rg);toast('Text selected. Copy it from here.');};
    try{navigator.clipboard.writeText(txt).then(done,fallback);}catch(err){fallback();}
  }
  else if(act==='qrate'||act==='qaway'){
    var qa=byId(el.getAttribute('data-id')), qn=state.current[qa.site];
    state.records[qa.id]=state.records[qa.id]||{};
    var qr=state.records[qa.id][qn]||freshRec(qa,qn); qr.c=qr.c||{};
    if(act==='qaway'){qr.present=!qr.present;}
    else{var qt=el.getAttribute('data-tid');qr.r[qt]=+el.getAttribute('data-v');delete qr.c[qt];qr.coach=state.coach;if(!qr.work||qr._autoWork!==false)qr.work=suggestWork(qr.r,SESS[qn-1].foc);}
    state.records[qa.id][qn]=qr; save(); render();
  }
  else if(act==='import'){
    var lines=($('#csvIn').value||'').split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean), added=0, bad=0;
    lines.forEach(function(l){var c=l.split(',').map(function(x){return x.trim();});
      if(c.length<7||!/^(8-9|10-11)$/.test(c[2])||!/^(prosper|plano)$/i.test(c[4])||!c[0]){bad++;return;}
      addAthlete({first:c[0],last:c[1],band:c[2],num:c[3],site:c[4].toLowerCase(),guardian:c[5],contact:c.slice(6).join(',')});added++;});
    save();render();toast('Added '+added+' athlete'+(added===1?'':'s')+(bad?'. '+bad+' row'+(bad===1?'':'s')+' skipped: check age group (8-9 or 10-11) and site (prosper or plano).':''));
  }
  else if(act==='open'){openSheet(el.getAttribute('data-id'));}
  else if(act==='close'){closeSheet();}
  else if(act==='present'){readSheetInputs();draft.present=!draft.present;renderSheet();}
  else if(act==='rate'){
    var tid=el.getAttribute('data-tid'),v=+el.getAttribute('data-v');draft.r[tid]=v;delete draft.c[tid];
    el.parentNode.querySelectorAll('button').forEach(function(b){var on=+b.getAttribute('data-v')===v;b.classList.toggle('on',on);b.classList.remove('carry');b.setAttribute('aria-pressed',String(on));});
    $('#rub_'+tid).innerHTML=rubric(T_(tid),v,false);
    if(draft._autoWork){draft.work='';var wc=$('#workChips');if(wc)wc.innerHTML=workChips();}
  }
  else if(act==='work'){draft.work=el.getAttribute('data-tid');draft._autoWork=false;$('#workChips').innerHTML=workChips();}
  else if(act==='phrase'){var ta=$('#f_shout'),p=PHRASES[+el.getAttribute('data-i')][1].replace('{n}',first(draftA.name));ta.value=ta.value.trim()?ta.value.trim()+' '+p:p;}
  else if(act==='tag'){var tg=el.getAttribute('data-tag'),i=draft.tags.indexOf(tg);if(i>=0)draft.tags.splice(i,1);else draft.tags.push(tg);el.setAttribute('aria-pressed',String(i<0));}
  else if(act==='save'){
    readSheetInputs();
    var S=SESS[draftN-1];
    if(draft.present){var missing=S.foc.filter(function(id){return draft.r[id]==null||draft.c[id];});if(missing.length){toast('Tap a rating for '+missing.map(function(id){return T_(id).name;}).join(' and '));return;}
      if(!draft.work)draft.work=suggestWork(draft.r,S.foc);}
    draft.coach=state.coach; var auto=!!draft._autoWork; delete draft._autoWork; if(!auto)draft._autoWork=false;
    state.records[draftA.id]=state.records[draftA.id]||{};state.records[draftA.id][draftN]=draft;
    var nm=draftA.name, aid=draftA.id, goNext=el.getAttribute('data-next')==='1';
    save(); closeSheet(); render();
    var nt=goNext?nextTodo(aid):null;
    if(nt){openSheet(nt.id);toast('Saved '+nm);}
    else toast(goNext?'Saved '+nm+'. Everyone in this group is done.':'Saved '+nm);
  }
  else if(act==='reset'){
    if(!resetArmed){resetArmed=true;el.textContent='Tap again to reset';setTimeout(function(){resetArmed=false;var b=$('#resetBtn');if(b)b.textContent='Reset demo data';},3000);return;}
    resetArmed=false;el.textContent='Reset demo data';state=makeDemo();save();render();toast('Demo data reset');
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='addForm')return; e.preventDefault();
  var g=function(id){return $('#'+id).value;};
  addAthlete({first:g('nf_first'),last:g('nf_last'),band:g('nf_band'),num:g('nf_num'),site:g('nf_site'),guardian:g('nf_g'),contact:g('nf_c')});
  save();render();toast('Added '+g('nf_first')+' to the roster');
});
document.addEventListener('change',function(e){
  var p=e.target.getAttribute&&e.target.getAttribute('data-pick');
  if(p==='pPick'){state.parentChild=e.target.value;save();render();}
  if(p==='aPick'){state.athleteChild=e.target.value;save();render();}
  if(p==='coach'){state.coach=e.target.value;save();}
});
$('#sheet').addEventListener('click',function(e){if(e.target.id==='sheet')closeSheet();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});
window.addEventListener('hashchange',render);
render();
})();
</script>
