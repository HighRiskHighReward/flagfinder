<title>HR² Camp Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: black HR² header band like hrx2performance.com; one column on phones, two-column dashboard from 900px.
   Brand: black sections, gold accents (#D4C618 / #C7B426 / #E6DB49), bronze #B47D2C, Audiowide display + Poppins body. */
:root{
  --bg:#070707; --surface:#111111; --surface-2:#1A1A19; --line:#2B2A25;
  --fg:#F5F4EE; --muted:#A6A499;
  --accent:#D4C618; --accent-ink:#E6DB49; --on-accent:#0B0B0B;
  --bronze:#B47D2C; --bronze-ink:#D69B47;
  --hdr-bg:#000000; --hdr-fg:#FFFFFF; --hdr-muted:#A6A499;
  --turf:#1B6E40; --turf-hi:#2DB566;
  --gA:#3CCB7F; --gB:#57AEF2; --gC:#EBA43A; --gD:#F07F3C; --gF:#F05A67;
  --shadow:0 12px 32px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.72);
  --f-display:"Audiowide","Eurostile","Arial Black",system-ui,sans-serif;
  --f-body:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F6F5F0; --surface:#FFFFFF; --surface-2:#EFEDE4; --line:#DCD8CA;
    --fg:#0B0B0B; --muted:#5D5B51;
    --accent:#D4C618; --accent-ink:#6B580C; --on-accent:#0B0B0B;
    --bronze:#B47D2C; --bronze-ink:#86581A;
    --turf:#25854D; --turf-hi:#39B06A;
    --gA:#16884C; --gB:#1D6FBD; --gC:#9A5F00; --gD:#B8520F; --gF:#C42B3A;
    --shadow:0 10px 26px rgba(20,20,10,.12);
    --scrim:rgba(11,11,11,.5);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F6F5F0; --surface:#FFFFFF; --surface-2:#EFEDE4; --line:#DCD8CA;
  --fg:#0B0B0B; --muted:#5D5B51;
  --accent:#D4C618; --accent-ink:#6B580C; --on-accent:#0B0B0B;
  --bronze:#B47D2C; --bronze-ink:#86581A;
  --turf:#25854D; --turf-hi:#39B06A;
  --gA:#16884C; --gB:#1D6FBD; --gC:#9A5F00; --gD:#B8520F; --gF:#C42B3A;
  --shadow:0 10px 26px rgba(20,20,10,.12);
  --scrim:rgba(11,11,11,.5);
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr-bg)}
h1,h2{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.1;letter-spacing:.02em}
h2{font-size:1.3rem;text-transform:uppercase}
h3{font-family:var(--f-body);font-size:.95rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:0;line-height:1.2}
h4{margin:0}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.ink{color:var(--accent-ink)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header: always black, like the website */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr-bg);color:var(--hdr-fg);border-bottom:2px solid var(--accent)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
#brandMark{flex:none;display:grid;place-items:center;height:42px}
#brandMark img{height:42px;width:auto;max-width:140px;object-fit:contain;display:block}
.mark{font-family:var(--f-display);font-size:1.5rem;color:#D4C618;line-height:1;letter-spacing:.02em}
.mark sup{font-size:.6em;vertical-align:super;line-height:0}
.brand b{display:block;font-family:var(--f-display);font-weight:400;font-size:.95rem;letter-spacing:.06em;line-height:1.1;color:var(--hdr-fg)}
.brand span{display:block;font-size:.68rem;color:var(--hdr-muted);letter-spacing:.12em;text-transform:uppercase}
.roles{display:flex;background:#151515;border:1px solid #2B2A25;border-radius:999px;padding:3px;gap:2px}
.roles a{color:var(--hdr-muted);text-decoration:none;font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border-radius:999px}
.roles a[aria-current="page"]{background:#D4C618;color:#0B0B0B}
.demo{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.demo .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:6px}
.tag-demo{font-weight:800;letter-spacing:.14em;color:var(--accent-ink);margin-right:6px}
.linkbtn{background:none;border:0;color:var(--fg);text-decoration:underline;padding:4px 0;font-size:.8rem}

main{padding-block:20px 56px}
.stack{display:grid;gap:16px}
.stack>*{min-width:0}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
.grid2>*{min-width:0}
@media (min-width:900px){.grid2{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);align-items:start}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}

/* Controls */
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 16px;font-weight:700;letter-spacing:.02em}
.btn:hover{border-color:var(--muted)}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-acc:hover{filter:brightness(1.06);border-color:var(--accent)}
.btn-big{padding:14px 20px;font-size:1rem}
.btn[disabled]{opacity:.55;cursor:default;filter:none}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-weight:700;font-size:.84rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.seg.div button{padding:8px 18px;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase}
.seg.div button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:600;max-width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.76rem;font-weight:700;background:var(--surface-2);white-space:nowrap}
.chip.ok{color:var(--gA);border-color:currentColor}
.chip.warn{color:var(--gC);border-color:currentColor}
.chip.off{color:var(--muted)}
.chip.gold{color:var(--accent-ink);border-color:currentColor}
.chip.pos{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-family:var(--f-display);font-weight:400;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:800;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.subtabs .count{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:.72rem;margin-left:6px;padding:0 6px}

.gA{color:var(--gA)} .gB{color:var(--gB)} .gC{color:var(--gC)} .gD{color:var(--gD)} .gF{color:var(--gF)}
.bgA{background:var(--gA)} .bgB{background:var(--gB)} .bgC{background:var(--gC)} .bgD{background:var(--gD)} .bgF{background:var(--gF)}

/* Athlete label: number first, then name, then position */
.jersey{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;background:var(--hdr-bg);color:#D4C618;border:1px solid #2B2A25;font-family:var(--f-display);font-size:1.05rem;flex:none}
.who-name{font-weight:700;line-height:1.2}

/* Coach */
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.ctl-l{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:1.2rem;font-weight:700;flex:none}
.sess-title{font-family:var(--f-display);font-size:1.45rem;text-transform:uppercase;line-height:1.1}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--accent)}
.roster{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.ath{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.ath:hover{border-color:var(--accent)}
.ath small{color:var(--muted);font-size:.76rem}
.ath .sc{font-family:var(--f-display);font-size:1.25rem;text-align:right;line-height:1}
.ath .sc small{display:block;font-family:var(--f-body);font-weight:600;font-size:.68rem;margin-top:4px}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:8px}
.list li:last-child{border-bottom:0;padding-bottom:0}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-weight:600}
.steps li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-family:var(--f-display)}

.qr{display:grid;gap:8px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.qrow .who{display:flex;gap:10px;align-items:center;min-width:0}
.qrow .who small{color:var(--muted);font-size:.74rem;display:block}
.qrow .scale{grid-column:1 / -1}
@media (min-width:700px){.qrow{grid-template-columns:minmax(0,240px) minmax(0,1fr) auto}.qrow .scale{grid-column:auto}}
.qrow.away{opacity:.55}
.mini{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 10px;font-size:.76rem;font-weight:700}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;justify-content:center;align-items:flex-end}
@media (min-width:760px){.sheet{align-items:center}}
.sheet-p{background:var(--bg);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;border:1px solid var(--line);border-top:3px solid var(--accent);box-shadow:var(--shadow);padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.sheet-p{border-radius:18px;max-height:88%}}
.sheet-h{position:sticky;top:0;background:var(--bg);display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:14px;border-bottom:1px solid var(--line);z-index:1}
.sheet-f{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.sheet-sec{padding-top:18px;display:grid;gap:12px}
.rate{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.rate-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.rate-h b{font-weight:700}
.rate-h span{color:var(--muted);font-size:.8rem}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-display);font-size:1.05rem}
.scale button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.scale button.carry{border:2px dashed var(--muted)}
.rub{font-size:.84rem;color:var(--muted);min-height:1.3em}
.rub b{color:var(--fg)}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
details.more summary{cursor:pointer;font-weight:700}
details.more[open] summary{margin-bottom:12px}
details.more .rate{background:var(--surface-2)}
.tests{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.field{display:grid;gap:4px;min-width:0}
.field label{font-weight:700;font-size:.84rem}
.field input,.field textarea,.field select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.field small{color:var(--muted);font-size:.74rem}
.tagbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.84rem}
.tagbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tagbtn.sug{border-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700}
.sw{width:52px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw[aria-checked="true"]{background:var(--turf-hi);border-color:var(--turf-hi)}
.sw[aria-checked="true"]::after{left:25px;background:#fff}

.fam{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fam summary{cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.fam summary small{display:block;color:var(--muted);font-size:.78rem;overflow-wrap:anywhere}
.msg{white-space:pre-wrap;font-family:var(--f-body);font-size:.9rem;background:var(--surface-2);border-radius:10px;padding:12px 14px;margin:12px 0 10px;overflow-wrap:anywhere}
.formgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
td .num{font-size:1rem}
td small{display:block;color:var(--muted);font-size:.74rem}
code{font-size:.8rem;background:var(--surface-2);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}

/* Parent */
.hero{display:grid;gap:18px;grid-template-columns:1fr;align-items:center;background:var(--hdr-bg);color:var(--hdr-fg);border:1px solid #2B2A25;border-radius:16px;padding:22px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:auto -10% -60% auto;width:340px;height:340px;background:radial-gradient(circle,rgba(212,198,24,.22),transparent 65%);pointer-events:none}
@media (min-width:640px){.hero{grid-template-columns:1fr auto}}
.hero .eyebrow{color:#A6A499}
.hero h1{font-size:clamp(1.9rem,6vw,3rem);text-transform:uppercase;color:#FFFFFF}
.hero h1 .n{color:#D4C618}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 10px;color:#C9C7BC;font-weight:600;margin-top:10px;align-items:center}
.hero .lede{margin-top:14px;font-weight:600;max-width:46ch;color:#E9E8E1}
.ringbox{display:grid;justify-items:center;gap:8px;position:relative}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val b{font-family:var(--f-display);font-weight:400;font-size:2.6rem;line-height:1}
.ring .val small{display:block;font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A6A499;margin-top:4px}
.ring-track{stroke:#222220}
.ring-bar{stroke:currentColor;transition:stroke-dashoffset .6s ease}
.hero .gA{color:#3CCB7F}.hero .gB{color:#57AEF2}.hero .gC{color:#EBA43A}.hero .gD{color:#F07F3C}.hero .gF{color:#F05A67}

.update{border-left:4px solid var(--accent)}
.quote{font-size:1.02rem;font-weight:500;border-radius:12px;background:var(--surface-2);padding:14px 16px;margin-top:6px}
.quote cite{display:block;font-style:normal;font-size:.78rem;color:var(--muted);margin-top:6px;font-weight:700}
.kv{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));margin-top:14px}
.kv div{min-width:0}
.kv p{font-weight:600}
.mission{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border:1px dashed var(--bronze);border-radius:12px;padding:12px 14px;margin-top:14px}
.mission svg{flex:none;color:var(--bronze-ink)}

.plan{display:grid;gap:12px}
.goal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--surface-2);border-radius:12px;padding:14px}
.goal .rank{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-size:1.05rem;background:var(--surface);border:1px solid var(--line)}
.goal.first .rank{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.goal h4{font-family:var(--f-display);font-weight:400;font-size:1.05rem;text-transform:uppercase;letter-spacing:.03em}
.goal p{margin-top:4px}
.drill{margin-top:8px;border-left:3px solid var(--bronze);padding-left:10px;font-weight:600}
.keep{display:flex;gap:10px;align-items:center;font-weight:700;flex-wrap:wrap}

/* Fall 2027 outlook */
.fall{background:var(--hdr-bg);color:#F5F4EE;border:1px solid #2B2A25;border-top:3px solid #D4C618;border-radius:16px;padding:22px;display:grid;gap:18px}
.fall .eyebrow{color:#A6A499}
.fall h2{color:#FFFFFF;font-size:1.5rem}
.fall .muted{color:#A6A499}
.tier{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tier .badge-t{font-family:var(--f-display);font-size:1.15rem;text-transform:uppercase;background:#D4C618;color:#0B0B0B;padding:6px 14px;border-radius:8px;letter-spacing:.04em}
.tier p{font-weight:600;max-width:52ch;color:#E9E8E1}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ladder div{border-radius:6px;padding:8px 6px;text-align:center;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#1A1A19;color:#7E7C73}
.ladder div.on{background:#D4C618;color:#0B0B0B}
.ladder div.past{background:#3B3818;color:#D4C618}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.fbox{background:#111111;border:1px solid #2B2A25;border-radius:12px;padding:14px;min-width:0}
.fbox h3{color:#D4C618;margin-bottom:8px}
.pill-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed #2B2A25}
.pill-row:last-child{border-bottom:0}
.st{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.st.ready{background:#123A24;color:#5BE39A}.st.track{background:#3B3818;color:#E6DB49}.st.build{background:#3A2412;color:#F2A65A}
.weeks{display:grid;gap:8px}

/* ---------- Scoring ---------- */
// Ratings 1–5 → 100-point scale: 1≈55 (F), 2≈66 (D), 3≈76 (C), 4≈87 (B+), 5=98 (A+).
function rScore(r){return 44+10.8*r;}
// Tests: age-band "developing" floor = 55, "elite" ceiling = 98.
function tScore(t,v,band){if(v==null||v==='')return null;var fc=t.b[band];return 55+43*clamp((v-fc[0])/(fc[1]-fc[0]),0,1);}
function pres(a,ss){return ss.map(function(n){return [n,rec(a,n)];}).filter(function(x){return x[1]&&x[1].present;});}
function traitNow(a,tid,ss){var v=pres(a,ss).map(function(x){return x[1].r[tid];}).filter(function(x){return x!=null;});return v.length?avg(v.slice(-2)):null;}
function pillar(a,p,ss){if(p==='ath')return athletic(a,ss);var v=TRAITS.filter(function(t){return t.p===p;}).map(function(t){return traitNow(a,t.id,ss);}).filter(function(x){return x!=null;});return v.length?rScore(avg(v)):null;}
function tests(a,ss){
  var out={};
  TESTS.forEach(function(t){
    var vals=pres(a,ss).filter(function(x){return x[1].t&&x[1].t[t.id]!=null&&x[1].t[t.id]!=='';}).map(function(x){return {n:x[0],v:+x[1].t[t.id]};});
    var best=null; vals.forEach(function(x){if(!best||(t.lower?x.v<best.v:x.v>best.v))best=x;});
    out[t.id]={vals:vals,base:vals[0]||null,latest:vals[vals.length-1]||null,best:best};
  });
  return out;
}

function positionRead(a,ss){
  var T=tests(a,ss);
  function ts(id){var x=T[id].latest;return x?(tScore(TS_(id),x.v,a.band)-55)/43:.5;}
  function tr(id){var v=traitNow(a,id,ss);return v==null?.5:(v-1)/4;}
  var sp=ts('dash'),ag=ts('shuttle'),pw=ts('broad'),st=ts('push');
  return [
    ['QB',tr('iq')*.3+tr('lead')*.2+tr('hands')*.2+tr('focus')*.15+tr('conf')*.15],
    ['WR',sp*.3+tr('hands')*.35+ag*.2+tr('feet')*.15],
    ['RB',ag*.3+pw*.25+tr('tough')*.25+sp*.2],
    ['TE',tr('hands')*.3+pw*.25+tr('tough')*.25+st*.2],
    ['DB',sp*.3+ag*.3+tr('feet')*.2+tr('iq')*.2],
    ['LB',tr('tough')*.3+pw*.25+tr('compete')*.25+tr('iq')*.2],
    ['OL',st*.4+tr('tough')*.3+pw*.3],
    ['DL',st*.35+pw*.3+tr('compete')*.35],
    ['C',tr('hands')*.35+tr('iq')*.35+tr('focus')*.3],
    ['RUSH',sp*.4+tr('compete')*.3+ag*.3]
  ].map(function(p){return {k:p[0],n:POS[p[0]],v:Math.round(40+60*p[1])};}).sort(function(x,y){return y.v-x.v;});
}
function fallOutlook(a,ss){

  var fits=positionRead(a,ss), pref=a.pos==='ATH'?fits[0]:fits.filter(function(f){return f.k===a.pos;})[0]||fits[0];
  var alt=fits.filter(function(f){return f.k!==pref.k;})[0];
  return {ov:ov,tierIdx:tierIdx,tier:FALL[tierIdx],pref:pref,alt:alt,plan:growthPlan(a,ss)};

var dirty={};
document.addEventListener('input',function(e){if(e.target&&e.target.id)dirty[e.target.id]=1;});

// Re-render without losing what someone is typing: keeps edited fields, focus and caret.
function rebuild(el,html){
  var keep={},ae=document.activeElement,fid=ae&&el.contains(ae)?ae.id:null,ss=null,se=null;
  try{if(fid&&ae.selectionStart!=null){ss=ae.selectionStart;se=ae.selectionEnd;}}catch(e){}
  el.querySelectorAll('input[id],textarea[id],select[id]').forEach(function(x){if(dirty[x.id])keep[x.id]=x.type==='checkbox'?x.checked:x.value;});
  el.innerHTML=html;
  Object.keys(keep).forEach(function(id){var x=document.getElementById(id);if(x&&el.contains(x)){if(x.type==='checkbox')x.checked=keep[id];else x.value=keep[id];}});
  if(fid){var f=document.getElementById(fid);if(f&&el.contains(f)){f.focus();try{if(ss!=null)f.setSelectionRange(ss,se);}catch(e){}}}
}

function trendChart(pts){
  var W=600,H=250,pl=44,pr=34,pt=30,pb=34;
  function x(n){return pl+(n-1)*(W-pl-pr)/7;}
  function y(v){return pt+(100-clamp(v,50,100))*(H-pt-pb)/50;}
  var g='';
  [[60,'D'],[70,'C'],[80,'B'],[90,'A'],[100,'']].forEach(function(l){g+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(l[0])+'" y2="'+y(l[0])+'"/><text x="'+(pl-6)+'" y="'+(y(l[0])+5)+'" text-anchor="end">'+l[0]+'</text>'+(l[1]?'<text x="'+(W-pr+8)+'" y="'+(y(l[0]-5)+5)+'">'+l[1]+'</text>':'');});
  for(var n=1;n<=8;n++)g+='<text x="'+x(n)+'" y="'+(H-8)+'" text-anchor="middle">S'+n+'</text>';
  pts=pts.filter(function(p){return p.v!=null;});
  if(!pts.length)return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="No scores yet">'+g+'</svg>';
  var line=pts.map(function(p,i){return (i?'L':'M')+x(p.n).toFixed(1)+' '+y(p.v).toFixed(1);}).join(' ');
  var area=line+' L'+x(pts[pts.length-1].n).toFixed(1)+' '+y(50)+' L'+x(pts[0].n).toFixed(1)+' '+y(50)+' Z';
  var dots=pts.map(function(p,i){return '<circle class="dot'+(i===pts.length-1?' end':'')+'" cx="'+x(p.n)+'" cy="'+y(p.v)+'" r="'+(i===pts.length-1?6:4)+'"/>';}).join('');
  var e=pts[pts.length-1];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Overall score by session, latest '+fmt(e.v)+'">'+g+'<path class="area" d="'+area+'"/><path class="line" d="'+line+'"/>'+dots+'<text class="endlbl" x="'+x(e.n)+'" y="'+(y(e.v)-12)+'" text-anchor="middle">'+fmt(e.v)+'</text></svg>';
}

  store.docs[p]=data;

    var prev=store.chains[p]||Promise.resolve();
    store.chains[p]=prev.then(function(){return store.db.doc(p).set(data);}).catch(function(e){
      var c=e&&e.code;

    });

}

function profileLine(P){

  if(h('char')&&h('skill')&&P.char>=82&&P.skill<74)return 'Great teammate who is still learning the game.';
  if(h('skill')&&h('mind')&&P.skill>=82&&P.mind<74)return 'Skilled player who needs confidence and toughness.';
  var ks=PILLARS.filter(function(p){return h(p.id);}).sort(function(a,b){return P[b.id]-P[a.id];});

function initLive(){
  if(!window.claude||typeof window.claude.use!=='function'){store.resolved=true;return;}
  store.canHead=false; // locked until this viewer is confirmed as the owner
  window.claude.use('db').then(function(db){
    store.resolved=true;
    if(!db){store.canHead=true;scheduleRender();return;}
    store.db=db; store.on=true; store.docs={}; store.stale=true; seenMsg=null; athCache=null; store.canHead=store.isOwner===true;
    var pending=COLLS.length, tm=setTimeout(function(){store.stale=true;scheduleRender();},10000);
    COLLS.forEach(function(c){
      var firstLive=true;
      db.collection(c).onSnapshot(function(snap){
        snap.docChanges().forEach(function(ch){var p=c+'/'+ch.doc.id;if(ch.type==='removed')delete store.docs[p];else store.docs[p]=ch.doc.data();});
        if(firstLive&&!snap.metadata.fromCache){firstLive=false;pending--;if(pending<=0){clearTimeout(tm);store.stale=false;}}
        onLiveChange();
      },function(){clearTimeout(tm);store.stale=true;scheduleRender();});
    });
    scheduleRender();
  }).catch(function(){});
  window.claude.use('user').then(function(u){
    if(!u){store.isOwner=false;if(store.on)store.canHead=false;scheduleRender();return;}
    Promise.resolve(u.isOwner()).then(function(v){store.isOwner=v===true;if(store.on||!store.resolved)store.canHead=store.isOwner;scheduleRender();}).catch(function(){store.isOwner=false;if(store.on)store.canHead=false;scheduleRender();});
  }).catch(function(){});
}

  else if(act==='clearlive'){
    if(el.getAttribute('data-armed')!=='1'){el.setAttribute('data-armed','1');el.textContent='Tap again to clear';setTimeout(function(){var b=$('#clearLiveBtn');if(b){b.removeAttribute('data-armed');b.textContent='Clear feed, messages & flags';}},3000);return;}
    Object.keys(store.docs).forEach(function(k){if(/^(feed|msgs|acks)\//.test(k))sset(k,k.indexOf('feed/')===0?{events:[]}:k.indexOf('acks/')===0?{read:{}}:{items:[]});});
    sset('live/flags',{map:{}});toast('Feed, messages and flags cleared');
  }
  else if(act==='copy'){
    var pre=$('#msg_'+el.getAttribute('data-id')), txt=pre?pre.textContent:'';
    var ok=function(){el.textContent='Copied';setTimeout(function(){el.textContent='Copy message';},1500);};
    var fallback=function(){var rg=document.createRange();rg.selectNodeContents(pre);var sel=window.getSelection();sel.removeAllRanges();sel.addRange(rg);toast('Text selected. Copy it from here.');};
    try{navigator.clipboard.writeText(txt).then(ok,fallback);}catch(err){fallback();}
  }
  else if(act==='qrate'||act==='qaway'){
    var qa=byId(el.getAttribute('data-id')), qn=state.current[qa.site];
    state.records[qa.id]=state.records[qa.id]||{};
    var qex=rec(qa,qn), qr=qex?JSON.parse(JSON.stringify(qex)):freshRec(qa,qn); qr.c=qr.c||{};
    if(act==='qaway'){qr.present=!qr.present;pushFeed({t:'absent',aid:qa.id,n:qn,here:qr.present});}
    else{var qt=el.getAttribute('data-tid');qr.r[qt]=+el.getAttribute('data-v');delete qr.c[qt];qr.coach=me();if(qr._autoWork!==false)qr.work=suggestWork(qr.r,SESS[qn-1].foc);pushFeed({t:'rate',aid:qa.id,n:qn,tid:qt,v:qr.r[qt]});}
    state.records[qa.id][qn]=qr; sset('ratings/'+qa.id+'_'+qn,qr); save(); render();
  }
  else if(act==='import'){
    var lines=($('#csvIn').value||'').split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean), added=0, bad=0;
    lines.forEach(function(l){var c=l.split(',').map(function(x){return x.trim();});
      var dv=(c[2]||'').toLowerCase();
      if(c.length<9||!c[0]||!/^(boys|girls)$/.test(dv)||!/^(8-9|10-11)$/.test(c[3])||!/^(prosper|plano)$/i.test(c[6])){bad++;return;}
      addAthlete({first:c[0],last:c[1],div:dv,band:c[3],num:c[4],pos:c[5],site:c[6].toLowerCase(),guardian:c[7],contact:c.slice(8).join(',')});added++;});
    save();render();toast('Added '+added+' athlete'+(added===1?'':'s')+(bad?'. '+bad+' row'+(bad===1?'':'s')+' skipped: check Boys/Girls, age group and site.':''));
  }
  else if(act==='open'){sheetKind='rate';openSheet(el.getAttribute('data-id'));}
  else if(act==='close'){closeSheet();}
  else if(act==='present'){readSheetInputs();draft.present=!draft.present;renderSheet();}
  else if(act==='rate'){
    var tid=el.getAttribute('data-tid'),v=+el.getAttribute('data-v');draft.r[tid]=v;delete draft.c[tid];
    el.parentNode.querySelectorAll('button').forEach(function(b){var on=+b.getAttribute('data-v')===v;b.classList.toggle('on',on);b.classList.remove('carry');b.setAttribute('aria-pressed',String(on));});
    $('#rub_'+tid).innerHTML=rubric(T_(tid),v,false);
    if(draft._autoWork){draft.work='';var wc=$('#workChips');if(wc)wc.innerHTML=workChips();}
  }
  else if(act==='work'){draft.work=el.getAttribute('data-tid');draft._autoWork=false;$('#workChips').innerHTML=workChips();}
  else if(act==='phrase'){var ta=$('#f_shout'),p=PHRASES[+el.getAttribute('data-i')][1].replace('{n}',first(draftA.name));ta.value=ta.value.trim()?ta.value.trim()+' '+p:p;}
  else if(act==='tag'){var tg=el.getAttribute('data-tag'),i=draft.tags.indexOf(tg);if(i>=0)draft.tags.splice(i,1);else draft.tags.push(tg);el.setAttribute('aria-pressed',String(i<0));}
  else if(act==='save'){
    readSheetInputs();
    var S=SESS[draftN-1];
    if(draft.present){var missing=S.foc.filter(function(id){return draft.r[id]==null||draft.c[id];});if(missing.length){toast('Tap a rating for '+missing.map(function(id){return T_(id).name;}).join(', '));return;}
      if(!draft.work)draft.work=suggestWork(draft.r,S.foc);}
    draft.coach=me(); var auto=!!draft._autoWork; delete draft._autoWork; if(!auto)draft._autoWork=false;
    state.records[draftA.id]=state.records[draftA.id]||{};state.records[draftA.id][draftN]=draft;
    sset('ratings/'+draftA.id+'_'+draftN,JSON.parse(JSON.stringify(draft)));
    if(!draft.present)pushFeed({t:'absent',aid:draftA.id,n:draftN,here:false});
    else{var fr={};S.foc.forEach(function(id){fr[id]=draft.r[id];});pushFeed({t:'save',aid:draftA.id,n:draftN,r:fr,work:draft.work||'',shout:draft.shout?1:0,tests:S.test&&draft.t?Object.keys(draft.t).length:0});}
    var nm=label(draftA), aid=draftA.id, goNext=el.getAttribute('data-next')==='1';
    save(); closeSheet(); render();
    var nt=goNext?nextTodo(aid):null;
    if(nt){openSheet(nt.id);toast('Saved '+nm);}
    else toast(goNext?'Saved '+nm+'. Everyone here is done.':'Saved '+nm);
  }
  else if(act==='reset'){
    if(!resetArmed){resetArmed=true;el.textContent='Tap again to reset';setTimeout(function(){resetArmed=false;var b=$('#resetBtn');if(b)b.textContent='Reset demo data';},3000);return;}
    resetArmed=false;el.textContent='Reset demo data';var keepLogo=state.logo;state=makeDemo();state.logo=keepLogo;if(!store.db){store.docs={};try{localStorage.removeItem(LS_LIVE);}catch(_){}}save();render();toast('Demo data reset');
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='addForm')return; e.preventDefault();
  var g=function(id){return $('#'+id).value;};
  addAthlete({first:g('nf_first'),last:g('nf_last'),div:g('nf_div'),band:g('nf_band'),num:g('nf_num'),pos:g('nf_pos'),pod:g('nf_pod'),site:g('nf_site'),guardian:g('nf_g'),contact:g('nf_c')});
  clean('nf_');save();render();toast('Added #'+g('nf_num')+' '+g('nf_first')+' to the roster');
});
document.addEventListener('change',function(e){
  var t=e.target, p=t.getAttribute&&t.getAttribute('data-pick');
  if(p==='pPick'){state.parentChild=t.value;save();render();}
  if(p==='aPick'){state.athleteChild=t.value;save();render();}
  if(p==='coach'){state.coach=t.value;seenMsg=null;save();onLiveChange();render();}
  if(p==='msgTo'){state.msgTo=t.value;save();}
  if(t.getAttribute&&t.getAttribute('data-emsel')){state.emSel=state.emSel||{};state.emSel[t.getAttribute('data-emsel')]=t.checked;delete dirty[t.id];save();setTimeout(render,350);}
  if(t.id==='emNote'){state.emNote=state.emNote||{};state.emNote[state.emType||'post']=t.value.trim();delete dirty[t.id];save();setTimeout(render,350);}
  if(t.id==='emArrive'){state.emArrive=t.value.trim();delete dirty[t.id];save();setTimeout(render,350);}
  if(t.id==='emBring'){state.emBring=t.value.trim();delete dirty[t.id];save();setTimeout(render,350);}
  if(p==='pod'){var cfg=Object.assign({},(sget('live/config')||{}).podCoach||state.podCoach);cfg[t.id.replace('pod-','')]=t.value;sset('live/config',{podCoach:cfg});toast(PODS[t.id.replace('pod-','')].name+' pod → '+t.value);}
  if(t.id==='logoIn'&&t.files&&t.files[0]){
    var f=t.files[0];
    if(f.size>400*1024){toast('That file is '+Math.round(f.size/1024)+' KB. Use a logo under 400 KB.');t.value='';return;}
    var fr=new FileReader();fr.onload=function(){state.logo=String(fr.result);save();render();toast('Logo updated');};fr.onerror=function(){toast('Could not read that file. Try a PNG or JPG.');};fr.readAsDataURL(f);
  }
});
$('#sheet').addEventListener('click',function(e){if(e.target.id==='sheet')closeSheet();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});
window.addEventListener('hashchange',function(){seenMsg=null;onLiveChange();render();});
render();
initLive();
})();
</script>
