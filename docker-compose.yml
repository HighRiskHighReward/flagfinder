# Local infrastructure: Postgres + PostGIS and Mailpit (dev email catcher).
services:
  db:
    image: postgis/postgis:16-3.6
    environment: { POSTGRES_USER: flagfinder, POSTGRES_PASSWORD: flagfinder, POSTGRES_DB: flagfinder }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U flagfinder"], interval: 5s, retries: 10 }
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports: ["1025:1025", "8025:8025"]
volumes: { pgdata: {} }
