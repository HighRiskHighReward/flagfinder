# Render blueprint — FREE plan (ADR-022). One web service runs the site plus the
# combined worker+scheduler. The database is external (Supabase free tier, PostGIS).
# Paid, fully separated layout: render.paid.yaml.
services:
  - type: web
    name: flagfinder
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile.free
    healthCheckPath: /api/health
    envVars:
      - { key: DATABASE_URL, sync: false }   # Supabase "Session pooler" URI + ?sslmode=no-verify
      - { key: APP_BASE_URL, sync: false }   # e.g. https://flagfinder.onrender.com
      - { key: AUTH_SECRET, generateValue: true }
      - { key: APP_ENV, value: production }
      - { key: DB_POOL_MAX, value: "3" }
